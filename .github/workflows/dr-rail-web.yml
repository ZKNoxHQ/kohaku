name: dr rail web

# Builds Dr Rail as a static site (wasm engine in a Web Worker, see crates/railgun-viewer-web) and
# publishes it on GitHub Pages; the same files are kept as an artifact for any other static host.
# Pages: Settings > Pages > Source "GitHub Actions", and allow the branch in
# Settings > Environments > github-pages if it is not the default branch.
on:
  workflow_dispatch:
  push:
    branches: [zknox/dr-rail]
    paths:
      - crates/railgun-viewer/**
      - crates/railgun-viewer-web/**
      - crates/railgun/**
      - crates/railgun-broadcaster/**
      - crates/railgun-wallet/src/keys.rs
      - crates/railgun-wallet/static/waku-bundle.js
      - Cargo.lock
      - .github/workflows/dr-rail-web.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dr-rail-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: dr-rail-web

      - name: wasm-bindgen-cli and binaryen
        run: |
          set -eu
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen

      - name: build
        run: sh crates/railgun-viewer-web/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dr-rail-web
          path: crates/railgun-viewer-web/dist
          include-hidden-files: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/railgun-viewer-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
