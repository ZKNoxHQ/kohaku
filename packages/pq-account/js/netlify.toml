[build]
  command = "npm install && npm run build"
  publish = "dist"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
  
[[redirects]]
  from = "/minimal.html"
  to = "/minimal.html"
  status = 200

[[redirects]]
  from = "/apdu.txt"
  to = "/apdu.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/create-account.html"
  status = 200
