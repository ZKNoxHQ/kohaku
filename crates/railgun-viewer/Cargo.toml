[package]
name = "railgun-viewer"
version = "0.1.0"
edition = "2024"
description = "ZKNOX read-only Railgun history and lineage viewer on the kohaku Rust SDK (mnemonic or viewing key)"
publish = false

[[bin]]
name = "railgun-viewer"
path = "src/main.rs"

[dependencies]
alloy = { workspace = true, default-features = true }
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
hex = { workspace = true }
railgun = { workspace = true }
railgun-wallet = { path = "../railgun-wallet", default-features = false }
rand = { workspace = true }
reqwest = { workspace = true }
rmp-serde = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
