[package]
name = "waku-light"
version = "0.2.0"
edition = "2024"
description = "Waku light client (filter v2 + light push v2/v3 + metadata) on rust-libp2p"
publish = false

[lib]
doctest = false

[dependencies]
futures = { workspace = true }
libp2p = { version = "0.57", default-features = false, features = [
    "tokio", "dns", "tcp", "websocket", "noise", "yamux", "identify", "ping", "macros",
    "ed25519", "secp256k1",
] }
hickory-resolver = { version = "0.26", default-features = false }
libp2p-mplex = "0.44"
libp2p-stream = "0.5.0-alpha"
prost = "0.14"
# Not used directly: enables TLS 1.2 in the rustls that libp2p-websocket builds with
# (`with_safe_default_protocol_versions` is TLS 1.3 only without it). nwaku serves wss through
# nim-websock / BearSSL, which has no TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }
web-time = { workspace = true }

# Executor and timers: tokio on native targets. The browser build brings its own (see `rt`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }
