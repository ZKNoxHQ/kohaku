[package]
name = "railgun-ts"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--debuginfo",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { workspace = true }
alloy = { workspace = true }
async-trait = { workspace = true }
eip-1193-provider = { workspace = true, features = ["js"] }
js-sys = { workspace = true }
railgun = { workspace = true, features = ["js"] }
rand = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
tsify = { workspace = true, features = ["js"] }
userop-kit = { workspace = true, features = ["js"] }
userop-kit-ts = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
kohaku-db = { workspace = true }

# Browser Ledger transport (WebUSB). wasm32-only: the `webusb` feature pulls in
# web-sys, which does not build for native targets (railgun-ts also builds as an
# rlib for native tests).
[target.'cfg(target_arch = "wasm32")'.dependencies]
railgun-ledger = { workspace = true, features = ["webusb", "webble"] }
# Legacy transport: broadcasters over the Rust Waku light node (waku-light on the browser's
# WebSocket), no js-waku.
railgun-broadcaster = { path = "../railgun-broadcaster", features = ["light-node"] }
gloo-timers = { workspace = true, features = ["futures"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
