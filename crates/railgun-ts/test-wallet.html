<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Railgun web wallet — sync test (stage 1)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 44rem; }
      input { width: 100%; font-size: 1rem; padding: .4rem; box-sizing: border-box; }
      button { font-size: 1rem; padding: .6rem 1rem; margin-top: .6rem; }
      pre { background: #111; color: #6f6; padding: 1rem; border-radius: 6px;
            white-space: pre-wrap; word-break: break-all; margin-top: 1rem; font-size: .85rem; }
      label { font-size: .9rem; color: #444; }
    </style>
  </head>
  <body>
    <h1>Railgun web wallet — stage 1 (sync + balance)</h1>
    <label for="rpc">Sepolia RPC URL (must allow browser CORS)</label>
    <input id="rpc" value="https://ethereum-sepolia-rpc.publicnode.com" />
    <p><button id="go">Connect Ledger (WebUSB) → sync → balance</button></p>
    <p><button id="build" disabled>Build transfer to self (prove → Ledger-sign, no submit)</button></p>
    <label for="bundler">4337 bundler URL</label>
    <input id="bundler" value="https://public.pimlico.io/v2/11155111/rpc" />
    <label for="margin">Gas margin % (lower shrinks maxCost when the paymaster deposit is low; 25 = default)</label>
    <input id="margin" type="number" value="10" min="0" max="200" />
    <p><button id="submit" disabled>Submit transfer to self via 4337 (prove → Ledger-sign → broadcast)</button></p>
    <pre id="log"></pre>

    <script type="module">
      const out = document.getElementById("log");
      const log = (m) => { out.textContent += m + "\n"; console.log(m); };

      // --- Eip1193Provider over fetch JSON-RPC -------------------------------
      function makeProvider(rpcUrl) {
        let id = 0;
        const rpc = async (method, params) => {
          const res = await fetch(rpcUrl, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ jsonrpc: "2.0", id: ++id, method, params }),
          });
          const j = await res.json();
          if (j.error) throw new Error(method + ": " + (j.error.message || JSON.stringify(j.error)));
          return j.result;
        };
        const hexNum = (n) => "0x" + Number(n).toString(16);
        return {
          getChainId: async () => BigInt(await rpc("eth_chainId", [])),
          getBlockNumber: async () => BigInt(await rpc("eth_blockNumber", [])),
          getLogs: async (address, eventSignature, fromBlock, toBlock) => {
            const filter = { address };
            if (fromBlock != null) filter.fromBlock = hexNum(fromBlock);
            if (toBlock != null) filter.toBlock = hexNum(toBlock);
            if (eventSignature) filter.topics = [eventSignature];
            const logs = await rpc("eth_getLogs", [filter]);
            return logs.map((l) => ({
              blockNumber: l.blockNumber != null ? Number(BigInt(l.blockNumber)) : null,
              blockTimestamp: null,
              transactionHash: l.transactionHash,
              address: l.address ?? address,
              topics: l.topics ?? [],
              data: l.data ?? "0x",
            }));
          },
          ethCall: async (to, data) => await rpc("eth_call", [{ to, data }, "latest"]),
          // eth_call with state overrides + explicit from/gas, for the single-proof gas
          // simulation (one Ledger signature instead of one per fee-convergence round).
          ethCallOverrides: async (from, to, data, gas, stateOverride) =>
            await rpc("eth_call", [{ from, to, data, gas }, "latest", stateOverride]),
          getCode: async (address) => await rpc("eth_getCode", [address, "latest"]),
          estimateGas: async (to, from, data) => {
            const tx = { to, data };
            if (from) tx.from = from;
            return BigInt(await rpc("eth_estimateGas", [tx]));
          },
          getGasPrice: async () => BigInt(await rpc("eth_gasPrice", [])),
          getTransactionCount: async (address, block) =>
            BigInt(await rpc("eth_getTransactionCount", [address, block != null ? hexNum(block) : "latest"])),
        };
      }

      // --- Database over IndexedDB -----------------------------------------
      function makeDb(name) {
        const open = () => new Promise((res, rej) => {
          const r = indexedDB.open(name, 1);
          r.onupgradeneeded = () => r.result.createObjectStore("kv");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
        const run = async (mode, fn) => {
          const db = await open();
          return new Promise((res, rej) => {
            const rq = fn(db.transaction("kv", mode).objectStore("kv"));
            rq.onsuccess = () => res(rq.result);
            rq.onerror = () => rej(rq.error);
          });
        };
        return {
          get: async (k) => { const v = await run("readonly", (s) => s.get(k)); return v == null ? null : v; },
          set: async (k, v) => { await run("readwrite", (s) => s.put(v, k)); },
          delete: async (k) => { await run("readwrite", (s) => s.delete(k)); },
        };
      }

      // Cache-bust BOTH the JS glue and the wasm with one shared token so they always match and
      // never go stale. (A cached index.js was hiding new exports — marginPercent, maxCost — even
      // though the wasm binary itself was fresh.)
      const V = Date.now();
      const {
        default: init,
        chainConfigSepolia, withPoiEndpoint, RailgunBuilder, RailgunSigner,
        Bundler, Signer, SimpleSmartAccount,
      } = await import("./pkg/index.js?v=" + V);
      await init("./pkg/index_bg.wasm?v=" + V);
      log("secure context: " + window.isSecureContext + " | WebUSB: " + ("usb" in navigator));
      log("wasm ready.");

      // Kept between stages.
      let ethProvider = null, rg = null, signer = null, balance = null;
      const CHAIN_ID = 11155111n;
      const FEE_TOKEN = "0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14"; // Sepolia WETH (wrapped base token)

      const transferValue = () => {
        const amount = BigInt(balance[0].amount);
        return amount / 100n > 0n ? amount / 100n : 1n; // ~1% to self
      };

      document.getElementById("go").onclick = async () => {
        try {
          ethProvider = makeProvider(document.getElementById("rpc").value.trim());
          log("RPC chainId: " + (await ethProvider.getChainId()) + ", block: " + (await ethProvider.getBlockNumber()));

          // ppoi.fdi.network has a dead IPv6; the phone's browser fails to reach it.
          // Route POI through the same-origin desktop proxy (/poi), which forwards
          // to ppoi over working IPv4.
          const poiUrl = location.origin + "/poi";
          const chain = withPoiEndpoint(chainConfigSepolia(), poiUrl);
          log("POI endpoint (proxied): " + poiUrl);
          const db = makeDb("railgun-web-test");
          log("building provider (POI enabled)…");
          rg = await new RailgunBuilder(chain, ethProvider).withDatabase(db).withPoi().build();

          log("connect Ledger — approve spending pubkey + viewing key…");
          signer = await RailgunSigner.connectLedgerWebUsb(0);
          log("address: " + signer.address);
          await rg.register(signer);

          log("syncing (scans Railgun state + POI — may take a while)…");
          const t0 = performance.now();
          await rg.sync();
          log("synced in " + ((performance.now() - t0) / 1000).toFixed(1) + "s");

          balance = await rg.balance(signer.address);
          log("balance (POI-spendable): " + JSON.stringify(balance, (_k, v) => typeof v === "bigint" ? v.toString() : v));
          const funded = balance.length > 0;
          document.getElementById("build").disabled = !funded;
          document.getElementById("submit").disabled = !funded;
          if (!funded) log("(no spendable balance — connect the funded account, passphrase off)");
        } catch (e) {
          log("ERROR: " + (e && e.message ? e.message : e));
        }
      };

      document.getElementById("build").onclick = async () => {
        try {
          const asset = balance[0].asset;                 // reuse the exact AssetId the wallet holds
          const value = transferValue();                  // ~1% to self
          log("\nbuilding transfer of " + value + " (base units) to self…");
          log("  fetching proving artifacts (first time: a large download) + proving…");
          const t0 = performance.now();
          const builder = rg.transact().transfer(signer, signer.address, asset, value, "webusb test");
          log("  approve the blind-sign on the Ledger when prompted…");
          const tx = await rg.build(builder);             // fetch artifacts → prove → Ledger-sign
          const secs = ((performance.now() - t0) / 1000).toFixed(1);
          log("built + proved + signed in " + secs + "s ✓");
          log("  txData.to = " + tx.to);
          log("  txData.data length = " + (tx.data.length - 2) / 2 + " bytes");
          log("  (not submitted — this stage only proves the browser can prove + sign)");
        } catch (e) {
          log("BUILD ERROR: " + (e && e.message ? e.message : e));
        }
      };

      document.getElementById("submit").onclick = async () => {
        try {
          const bundler = Bundler.pimlico(document.getElementById("bundler").value.trim());
          // Ephemeral 7702 sender: random, unfunded — the privacy paymaster pays gas.
          const rnd = crypto.getRandomValues(new Uint8Array(32));
          const key = "0x" + [...rnd].map((b) => b.toString(16).padStart(2, "0")).join("");
          const eoa = Signer.privateKey(key);
          log("\nephemeral 7702 sender: " + eoa.address);
          const smartAccount = new SimpleSmartAccount(eoa.address, CHAIN_ID, ethProvider);

          const asset = balance[0].asset;
          const value = transferValue();
          log("submitting transfer of " + value + " (base units) to self via 4337…");
          log("  proving + Ledger blind-sign (fee note + transfer)…");
          const t0 = performance.now();
          const margin = parseInt(document.getElementById("margin").value, 10);
          log("  gas margin: " + margin + "%");
          const builder = rg.transact().transfer(signer, signer.address, asset, value, "webusb 4337");
          const signable = await rg.prepareUserOp(builder, bundler, smartAccount, signer, FEE_TOKEN, undefined, margin);
          log("  proved + signed in " + ((performance.now() - t0) / 1000).toFixed(1) + "s");
          log("  totalGasLimit = " + signable.totalGasLimit + " gas");
          log("  maxCost = " + (Number(signable.maxCost) / 1e18).toFixed(8) + " ETH (paymaster deposit must exceed this)");
          log("  signing userop + sending…");
          const signed = await signable.sign(eoa);
          const hash = await bundler.sendUserOperation(signed);
          log("  userOpHash: " + hash);
          log("  waiting for receipt…");
          const receipt = await bundler.waitForReceipt(hash);
          log("SUBMITTED ✓ receipt: " + JSON.stringify(receipt, (_k, v) => typeof v === "bigint" ? v.toString() : v));
        } catch (e) {
          log("SUBMIT ERROR: " + (e && e.message ? e.message : e));
        }
      };
    </script>
  </body>
</html>
