[package]
name = "railgun-ledger"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Native USB HID transport via coins-ledger. Off by default so workspace builds
# do not require system HID libraries (libudev headers on Linux).
usb = ["dep:coins-ledger", "dep:tokio"]
# Native Bluetooth LE transport via btleplug, for Flex/Stax/Nano X. Off by
# default so workspace builds do not require system BLE stacks (bluez/dbus on
# Linux). Needs the tokio time+sync features and a futures StreamExt.
ble = ["dep:btleplug", "dep:uuid", "dep:futures", "dep:tokio", "tokio/time"]

[dependencies]
async-trait = { workspace = true }
common = { workspace = true }
hex = { workspace = true }
railgun = { workspace = true }
ruint = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

coins-ledger = { version = "0.13", optional = true }
btleplug = { version = "0.13", optional = true }
uuid = { version = "1", optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
crypto = { workspace = true }
num-bigint = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "smoke"
required-features = ["usb"]

[[example]]
name = "ble_smoke"
required-features = ["ble"]
